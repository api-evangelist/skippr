aid: skippr
name: Skippr
description: >-
  Skippr builds "The Live AI Employee" — real-time AI agents that see, talk, and operate software.
  Its embeddable voice/vision agents demonstrate products, onboard new users, join customer video
  calls, and complete software tasks autonomously, so teams can drop an AI employee into their
  product, meetings, and internal tools. Skippr also ships a browser extension that runs AI product
  reviews from a PM, designer, content-strategist, and accessibility perspective, plus a
  Model Context Protocol (MCP) server that feeds those findings to AI coding agents such as
  Claude Code, Cursor, and Copilot. Developers integrate via the @skippr/live-agent-sdk npm
  package. Skippr is backed by Bessemer Venture Partners and is SOC 2 Type II and ISO 27001 certified.
